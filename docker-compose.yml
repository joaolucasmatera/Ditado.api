services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ditado-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ConexaoPadrao: Server=${MYSQL_HOST:-host.docker.internal};Port=${MYSQL_PORT:-3306};Database=${MYSQL_DATABASE:-ditado};User=${MYSQL_USER:-root};Password=${MYSQL_ROOT_PASSWORD}
      Jwt__ChaveSecreta: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou em .env.docker}
      Jwt__Emissor: ${JWT_ISSUER:-DitadoAPI}
      Jwt__Audiencia: ${JWT_AUDIENCE:-DitadoClientes}
      Llm__Enabled: ${LLM_ENABLED:-false}
      Llm__TimeoutSeconds: ${LLM_TIMEOUT_SECONDS:-15}
      Llm__MaxInputCharacters: ${LLM_MAX_INPUT_CHARACTERS:-8000}
      Llm__MaxOutputTokens: ${LLM_MAX_OUTPUT_TOKENS:-768}
      Llm__Chain__0__Provider: ${LLM_CHAIN_0_PROVIDER:-}
      Llm__Chain__0__Model: ${LLM_CHAIN_0_MODEL:-}
      Llm__Chain__1__Provider: ${LLM_CHAIN_1_PROVIDER:-}
      Llm__Chain__1__Model: ${LLM_CHAIN_1_MODEL:-}
      Llm__Chain__2__Provider: ${LLM_CHAIN_2_PROVIDER:-}
      Llm__Chain__2__Model: ${LLM_CHAIN_2_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${API_PORT:-5031}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: ../ditado-main/ditado-main
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ditado-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
